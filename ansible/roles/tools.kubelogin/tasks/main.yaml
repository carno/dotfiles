---
- name: Check latest kubelogin version
  ansible.builtin.uri:
    url: https://api.github.com/repos/Azure/kubelogin/releases/latest
    return_content: true
    user: "{{ github_user }}"
    password: "{{ github_token }}"
    force_basic_auth: "{{ gh_auth }}"
  no_log: true
  register: _kubelogin_github_details
  when: kubelogin.version is undefined
  tags:
    - never
    - kubelogin
    - kubernetes
    - work

- name: Set kubelogin.version
  ansible.builtin.set_fact:
    kubelogin:
      version: "{{ _kubelogin_github_details.json.tag_name }}"
  when: not _kubelogin_github_details is skipped
  tags:
    - never
    - kubelogin
    - kubernetes
    - work

- name: Install kubelogin
  ansible.builtin.unarchive:
    src: >-
      https://github.com/Azure/kubelogin/releases/download/{{
      kubelogin.version }}/kubelogin-linux-amd64.zip
    dest: "{{ lookup('ansible.builtin.env', 'HOME') }}/.local/bin"
    remote_src: true
    include:
      - kubelogin
  register: _kubelogin_install
  tags:
    - never
    - kubelogin
    - kubernetes
    - work
